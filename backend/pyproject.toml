[project]
name = "databricks-billing-api"
version = "1.0.0"
description = "Databricks Billing Analytics API"
authors = [
    {name = "Pradeep Macharla", email = "pradeep@automationpractice.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy[asyncio]==2.0.40",
    "asyncpg==0.30.0",
    "pydantic==2.11.3",
    "python-dateutil==2.9.0.post0",
    "numpy>=1.26,<2",
    "alembic==1.15.2",
    "pandas==2.2.3",
    "pyarrow==19.0.1",
    "python-dotenv==1.1.0",
    "azure-ai-evaluation==1.15.3",
    "azure-ai-inference==1.0.0b9",
    "azure-ai-projects==2.0.0",
    "azure-identity==1.25.2",
    "anthropic>=0.100.0",
    "openai>=2.36.0",
    "google-genai>=2.0.1",
    "duckdb>=1.1.0",
    "openpyxl>=3.1.0",
    # Cloud blob backends (fsspec adapters). Install only the ones you use;
    # they're listed here so containers built with --extra cloud get them.
    "fsspec>=2024.6.0",
    "s3fs>=2024.6.0",
    "adlfs>=2024.7.0",
    "gcsfs>=2024.6.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "email-validator>=2.0.0",
    "sqlglot>=25.0.0",
    # Spark Connect client (must match the server in docker-compose)
    "pyspark[connect]==4.1.1",
    "grpcio>=1.62",
    # DuckDB ↔ Postgres ATTACH (postgres scanner extension is loaded at runtime,
    # but we need psycopg-binary for a sync fallback when reading qi_* from PG)
    "psycopg[binary]>=3.2",
]

# The backend no longer talks to Databricks directly. Extraction lives in the
# `extractor` service (see /extractor in the repo). That keeps databricks-connect
# (pyspark 3.5.x bundled) out of this venv, which has pyspark 4.1.1 pinned to
# the local Spark Connect server.
