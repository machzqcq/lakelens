[pytest]
testpaths = unit integration
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
markers =
    requires_llm: needs LLM_TEST_KEY env var; skipped otherwise
    requires_db:  needs the test-db service (integration only)
addopts = -ra --strict-markers --tb=short
# Backend sys.path is set up by conftest.py — it walks up looking for
# a backend/ directory containing models.py, so it works whether you run
# pytest from tests/backend/, from the repo root, or anywhere else.
